name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Manifest is valid JSON
        run: python3 -m json.tool extension/manifest.json > /dev/null
      - name: Scripts parse
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Download zip matches extension/
        run: |
          mkdir -p /tmp/zip
          unzip -q public/stealz-extension.zip -d /tmp/zip
          diff -r extension /tmp/zip/stealz-extension
